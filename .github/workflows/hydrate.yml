name: hydrate

on:
  push:
    branches: [main]
    paths:
      - 'kubernetes/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: deployment
          path: deployment-branch

      - name: Instalar helm, helmfile y kubectl-slice
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          curl -fsSL https://github.com/helmfile/helmfile/releases/download/v1.7.0/helmfile_1.7.0_linux_amd64.tar.gz | tar xz helmfile
          sudo mv helmfile /usr/local/bin/helmfile
          curl -fsSL https://github.com/patrickdappollonio/kubectl-slice/releases/download/v1.4.2/kubectl-slice_linux_x86_64.tar.gz | tar xz kubectl-slice
          sudo mv kubectl-slice /usr/local/bin/kubectl-slice

      - name: Renderizar y separar (a carpeta temporal)
        run: |
          rm -rf /tmp/out && mkdir -p /tmp/out
          helmfile -f kubernetes/eks-demo/default/staging.yaml template > /tmp/rendered.yaml
          kubectl-slice --input-file /tmp/rendered.yaml --output-dir /tmp/out \
            --template '{{.metadata.name}}-{{.kind | lower}}.yml'

      - name: Un PR por microservicio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STAGING=kubernetes/eks-demo/default/staging
          RELEASE_FILE=kubernetes/eks-demo/default/staging.yaml

          cd deployment-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin deployment

          VERSION=$(grep -E '^\s*version:' "../$RELEASE_FILE" | head -1 | awk '{print $2}')
          {
            echo "## 🚀 Hidratación de staging"
            echo ""
            echo "Chart \`atm\` versión \`$VERSION\`"
            echo ""
            echo "| Microservicio | PR |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for vf in "../$STAGING"/*-values.yaml; do
            svc=$(basename "$vf" -values.yaml)
            branch="auto/hydrate-staging-$svc"
            echo "▶ $svc"

            git checkout -B "$branch" origin/deployment
            rm -f "$STAGING"/*"$svc"-*
            cp /tmp/out/*"$svc"-* "$STAGING"/ 2>/dev/null || true
            git add "$STAGING"

            if git diff --cached --quiet; then
              echo "  sin cambios, salto"
              echo "| $svc | (sin cambios) |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            git commit -m "chore: hydrate staging $svc"
            git push -f origin "$branch"

            url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
            if [ -z "$url" ]; then
              url=$(gh pr create --base deployment --head "$branch" \
                --title "Hydrate: $svc (staging)" \
                --body "Manifiestos de **$svc** en staging. Mergea para aplicar a \`deployment\`." \
                --label hydrate)
            fi
            echo "| $svc | $url |" >> "$GITHUB_STEP_SUMMARY"
          done
