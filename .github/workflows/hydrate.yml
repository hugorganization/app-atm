name: hydrate

on:
  push:
    branches: [main]
    paths:
      - 'kubernetes/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  hydrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: deployment
          path: deployment-branch

      - name: Instalar helm, helmfile y kubectl-slice
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          curl -fsSL https://github.com/helmfile/helmfile/releases/download/v1.7.0/helmfile_1.7.0_linux_amd64.tar.gz | tar xz helmfile
          sudo mv helmfile /usr/local/bin/helmfile
          curl -fsSL https://github.com/patrickdappollonio/kubectl-slice/releases/download/v1.4.2/kubectl-slice_linux_x86_64.tar.gz | tar xz kubectl-slice
          sudo mv kubectl-slice /usr/local/bin/kubectl-slice

      - name: Hidratar todos los ambientes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd deployment-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin deployment

          echo "## 🚀 Hidratación" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # BUCLE EXTERNO: cada ambiente = un fichero de release *.yaml
          for release_file in ../kubernetes/*/*/*.yaml; do
            env_path="${release_file%.yaml}"
            env_name=$(basename "$env_path")
            dest="${env_path#../}"
            echo "=== Ambiente: $env_name ==="

            VERSION=$(grep -E '^\s*version:' "$release_file" | head -1 | awk '{print $2}')
            {
              echo "### $env_name  (chart \`atm\` \`$VERSION\`)"
              echo ""
              echo "| Microservicio | PR |"
              echo "|---|---|"
            } >> "$GITHUB_STEP_SUMMARY"

            rm -rf /tmp/out && mkdir -p /tmp/out
            helmfile -f "$release_file" template > /tmp/rendered.yaml
            kubectl-slice --input-file /tmp/rendered.yaml --output-dir /tmp/out \
              --template '{{.metadata.name}}-{{.kind | lower}}.yml'

            for vf in "$env_path"/*-values.yaml; do
              svc=$(basename "$vf" -values.yaml)
              branch="auto/hydrate-$env_name-$svc"
              echo "▶ $env_name / $svc"

              git checkout -B "$branch" origin/deployment
              mkdir -p "$dest"
              rm -f "$dest"/*"$svc"-*
              cp /tmp/out/*"$svc"-* "$dest"/ 2>/dev/null || true
              git add "$dest"

              if git diff --cached --quiet; then
                echo "  sin cambios, salto"
                echo "| $svc | (sin cambios) |" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi

              git commit -m "chore: hydrate $env_name $svc"
              git push -f origin "$branch"

              url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
              if [ -z "$url" ]; then
                url=$(gh pr create --base deployment --head "$branch" \
                  --title "Hydrate: $env_name / $svc" \
                  --body "Manifiestos de **$svc** en $env_name. Mergea para aplicar a \`deployment\`." \
                  --label hydrate)
              fi
              echo "| $svc | $url |" >> "$GITHUB_STEP_SUMMARY"
            done

            echo "" >> "$GITHUB_STEP_SUMMARY"
          done
